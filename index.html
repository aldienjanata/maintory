    <style>
      body, html { margin: 0; padding: 0; background-color: #0d1117; width: 100%; height: 100%; }
      #initial-loader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: #0d1117;
      }
      .init-spinner {
        width: 36px; height: 36px; border-radius: 50%;
        border: 3px solid rgba(0, 163, 255, 0.15); border-top-color: #00a3ff;
        animation: initSpin 1s linear infinite; margin-bottom: 16px;
      }
      @keyframes initSpin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="init-spinner"></div>
      <div style="color: #6e7681; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 500;">Memuat Aplikasi...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hapus loader setelah React di-mount
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) loader.style.display = 'none';
        }, 500); // sedikit delay agar transisi mulus
      });
    </script>
  </body>
</html>
