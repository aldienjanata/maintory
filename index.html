    <meta name="description" content="Maintory adalah sistem aplikasi manajemen inventory, maintenance, dan dismantle cerdas untuk memudahkan pengelolaan stok barang dan teknisi lapangan Cabang Banyumas." />
    <meta name="keywords" content="maintory, manajemen inventory, maintenance, dismantle, aplikasi teknisi, stok gudang" />
    <meta name="author" content="Tim Maintory" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://maintory.vercel.app/" />
    <meta property="og:title" content="Maintory - Manajemen Inventory &amp; Maintenance" />
    <meta property="og:description" content="Sistem aplikasi pintar untuk kelola stok gudang, tugas teknisi, dan pencatatan maintenance." />
    <meta property="og:image" content="https://maintory.vercel.app/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://maintory.vercel.app/" />
    <meta property="twitter:title" content="Maintory - Manajemen Inventory &amp; Maintenance" />
    <meta property="twitter:description" content="Sistem aplikasi pintar untuk kelola stok gudang, tugas teknisi, dan pencatatan maintenance." />
    <meta property="twitter:image" content="https://maintory.vercel.app/logo.png" />
    
    <meta name="theme-color" content="#0d1117" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* ── Critical baseline (sebelum bundle CSS dimuat) ── */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #0d1117; color: #c9d1d9; height: 100%; }
      #root { height: 100%; }

      /* ── Splash screen — z-index lebih tinggi dari semua komponen React ── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        transition: opacity 0.35s ease;
      }
      #splash.hiding {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        filter: drop-shadow(0 4px 16px rgba(0,163,255,0.5));
        animation: spl-pulse 2s ease-in-out infinite;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(0,163,255,0.15);
        border-top-color: #00a3ff;
        animation: spl-spin 0.9s linear infinite;
      }
      .splash-text {
        font-size: 12px;
        color: #6e7681;
        font-weight: 500;
        font-family: 'Plus Jakarta Sans', sans-serif;
        letter-spacing: 0.05em;
      }
      @keyframes spl-spin  { to { transform: rotate(360deg); } }
      @keyframes spl-pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.8; transform:scale(0.95); } }
    </style>
  </head>
  <body>
    <!-- Splash — menutupi React sampai siap, dihapus dari main.jsx -->
    <div id="splash">
      <img class="splash-logo" src="/logo.png" alt="Maintory" width="72" height="72" />
      <div class="splash-spinner"></div>
      <span class="splash-text">Memuat Aplikasi…</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
